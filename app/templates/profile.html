{% extends "base.html" %}

{% block title %}Profile - Masala Magic{% endblock %}

{% block content %}
<div class="container mt-3">
  <div class="profile-card text-center">
    <div class="profile-avatar">
      <i class="fa-solid fa-user"></i>
    </div>
    <h2 class="mb-1">{{ username }}</h2>
    <p class="mb-2" style="color: var(--text-muted); font-size: 0.9rem;"><i class="fa-solid fa-calendar"></i> Joined: {{ created_at }}</p>

    <div class="mt-2" style="display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap;">
      <a href="{{ url_for('profile.update_profile') }}" class="btn btn-primary"><i class="fa-solid fa-pen-to-square"></i> Edit Profile</a>
      <form action="{{ url_for('profile.delete_profile') }}" method="POST" style="display:inline;"
            onsubmit="return confirm('Are you sure you want to delete your account? This cannot be undone.');">
        <button type="submit" class="btn btn-danger"><i class="fa-solid fa-trash"></i> Delete Account</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
