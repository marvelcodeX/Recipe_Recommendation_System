{% extends "base.html" %}

{% block title %}Update Profile - Masala Magic{% endblock %}

{% block content %}
<div class="container mt-3">
  <div class="form-container">
    <h2 class="text-center mb-2"><i class="fa-solid fa-pen-to-square" style="color: var(--primary);"></i> Update Your Profile</h2>

    <form method="POST" action="{{ url_for('profile.update_profile') }}">
      <div class="form-group">
        <label class="form-label" for="username"><i class="fa-solid fa-user"></i> Username</label>
        <input class="form-input" type="text" id="username" name="username"
               value="{{ current_username }}" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password"><i class="fa-solid fa-lock"></i> New Password</label>
        <input class="form-input" type="password" id="password" name="password"
               placeholder="Leave blank to keep current password">
      </div>

      <div class="mt-1" style="display: flex; gap: 0.75rem;">
        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button>
        <a href="{{ url_for('profile.profile') }}" class="btn btn-ghost"><i class="fa-solid fa-xmark"></i> Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
